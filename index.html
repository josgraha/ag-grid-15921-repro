<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AG Grid #15921 repro</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-enterprise@36.3.0/dist/ag-grid-enterprise.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; gap: 8px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      #status { font-family: ui-monospace, monospace; font-size: 13px; white-space: pre; }
      #myGrid { flex: 1; min-height: 300px; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="applyPivot">1. Apply saved pivot column state</button>
      <button id="autoSize">2. Auto-size columns (fixes it)</button>
      <button id="reset">Reset</button>
    </div>
    <div id="status"></div>
    <div id="myGrid"></div>
    <script src="main.js"></script>
  </body>
</html>
